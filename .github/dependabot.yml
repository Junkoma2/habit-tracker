version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # react向けlintプラグインがeslint 10に未対応のため、大きな版上げは当面見送る
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@eslint/js"
        update-types:
          - "version-update:semver-major"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
      dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
