version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
      dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
